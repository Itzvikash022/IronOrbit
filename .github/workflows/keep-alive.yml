name: Keep Render Awake

on:
  schedule:
    # Every 12 minutes — under Render free-tier 15m idle sleep
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "Missing GitHub secret RENDER_URL (e.g. https://iron-orbit.onrender.com)"
            exit 1
          fi
          curl -fsS --retry 3 --retry-delay 2 "${RENDER_URL%/}/api/health"
          echo
          echo "Keep-alive ping succeeded."
